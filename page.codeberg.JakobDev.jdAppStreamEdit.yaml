id: page.codeberg.JakobDev.jdAppStreamEdit
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: jdappstreamedit
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    - BASEAPP_REMOVE_PYWEBENGINE=1
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --share=ipc
  - --device=dri
  # For preview in Gnome Software
  - --talk-name=org.freedesktop.Flatpak
cleanup:
  - /share/installed-tests
  - /share/gettext
  - /share/gir-1.0
  - /share/man
  - /lib/*.la
  - /lib/*.a
  - /plugins

modules:
  - python3-modules.yaml

  - name: libfyaml
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://github.com/pantoniou/libfyaml/releases/download/v0.9.6/libfyaml-0.9.6.tar.gz
        sha256: a59cc3331e2eb903ec36933ad52a45888041cac31e44f553a00511131242c483
        x-checker-data:
          type: anitya
          project-id: 383614
          url-template: https://github.com/pantoniou/libfyaml/releases/download/v$version/libfyaml-$version.tar.gz
    cleanup:
      - /bin

  - name: git
    buildsystem: meson
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.55.0.tar.xz
        sha256: 457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357
        x-checker-data:
          type: anitya
          project-id: 5350
          url-template: https://mirrors.edge.kernel.org/pub/software/scm/git/git-$version.tar.xz
    cleanup:
      - /bin/scalar
      - /bin/git?*
      - /share

  - name: appstream-glib
    buildsystem: meson
    config-opts:
      - -Dgtk-doc=false
      - -Dbuilder=false
      - -Drpm=false
      - -Dman=false
    sources:
      - type: archive
        url: https://github.com/hughsie/appstream-glib/archive/refs/tags/appstream_glib_0_8_3.tar.gz
        sha256: 15ad7690b0132d883bd066699a7b55f6cef4c0f266d18d781ce5d8112fb4ee63
        x-checker-data:
          type: anitya
          project-id: 14018
          url-template: https://github.com/hughsie/appstream-glib/archive/refs/tags/appstream_glib_$version.tar.gz
    cleanup:
      - /share/bash-completion
      - /share/aclocal

  - name: libvips
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/libvips/libvips/releases/download/v8.18.6/vips-8.18.6.tar.xz
        sha256: 3c41e1d5458081bfa4a5bc54e116c46259c75c6760a18027764555632b9dda3e
        x-checker-data:
          type: anitya
          project-id: 5097
          url-template: https://github.com/libvips/libvips/releases/download/v$version/vips-$version.tar.xz

  - name: appstream
    buildsystem: meson
    config-opts:
      - -Dbash-completion=false
      - -Dblake3-support=false
      - -Dstemming=false
      - -Dapidocs=false
      - -Dcompose=true
      - -Dgir=false
      - -Dman=false
    sources:
      - type: archive
        url: https://github.com/ximion/appstream/archive/refs/tags/v1.2.0.tar.gz
        sha256: 02f723cb1afa372d434896e138503163a44ad49e4a813d0d30713fc38ccb8d0c
        x-checker-data:
          type: anitya
          project-id: 10385
          url-template: https://github.com/ximion/appstream/archive/refs/tags/v$version.tar.gz
    cleanup:
      - /share/metainfo

  - name: jdAppStreamEdit
    buildsystem: simple
    build-commands:
      - pip install --no-deps --no-build-isolation --prefix=$FLATPAK_DEST .
      - python ./install-unix-datafiles.py --prefix=$FLATPAK_DEST
    sources:
      - type: archive
        url: https://codeberg.org/JakobDev/jdAppStreamEdit/archive/9.2.tar.gz
        sha256: d29582d6fd4ca2675d222d1baad32d9682ff77114bc0454c05ee7058045ea568
        x-checker-data:
          type: json
          url: https://codeberg.org/api/v1/repos/JakobDev/jdAppStreamEdit/releases/latest
          version-query: .tag_name
          url-query: .tarball_url
