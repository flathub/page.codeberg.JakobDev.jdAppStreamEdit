id: page.codeberg.JakobDev.jdAppStreamEdit
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: jdappstreamedit
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    - BASEAPP_REMOVE_PYWEBENGINE=1
finish-args:
  - --socket=fallback-x11
  - --filesystem=/tmp:rw
  - --socket=wayland
  - --share=network
  - --device=dri
  - --share=ipc
  - --device=dri
cleanup:
  - /share/installed-tests
  - /share/gettext
  - /share/gir-1.0
  - /share/man
  - /lib/*.la
  - /lib/*.a
  - /plugins

modules:
  - python3-modules.yaml

  - name: libfyaml
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: 
          https://github.com/pantoniou/libfyaml/releases/download/v0.9.6/libfyaml-0.9.6.tar.gz
        sha256: a59cc3331e2eb903ec36933ad52a45888041cac31e44f553a00511131242c483
        x-checker-data:
          type: anitya
          project-id: 383614
          url-template: 
            https://github.com/pantoniou/libfyaml/releases/download/v$version/libfyaml-$version.tar.gz
    cleanup:
      - /bin

  - name: git
    buildsystem: meson
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.56.1.tar.xz
        sha256: f0b0bf89264b9bd2e1c640363e7529643989da76281600473c50745cd34a607f
        x-checker-data:
          type: anitya
          project-id: 5350
          url-template: https://mirrors.edge.kernel.org/pub/software/scm/git/git-$version.tar.xz
    cleanup:
      - /bin/scalar
      - /bin/git?*
      - /share

  - name: appstream-glib
    buildsystem: meson
    config-opts:
      - -Dgtk-doc=false
      - -Dbuilder=false
      - -Drpm=false
      - -Dman=false
    sources:
      - type: archive
        url: 
          https://github.com/hughsie/appstream-glib/archive/refs/tags/appstream_glib_0_8_4.tar.gz
        sha256: 19798c8fbd2734554848817e52ef351d21253b1df9fff288b7cf91c10618415d
        x-checker-data:
          type: anitya
          project-id: 14018
          url-template: 
            https://github.com/hughsie/appstream-glib/archive/refs/tags/appstream_glib_${major}_${minor}_${patch}.tar.gz
    cleanup:
      - /share/bash-completion
      - /share/aclocal

  - name: libvips
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/libvips/libvips/releases/download/v8.18.7/vips-8.18.7.tar.xz
        sha256: 5baaead3b0bb20ffdb9e9ff09aa9fda08620923df77b63b436654cb5e0b3bf94
        x-checker-data:
          type: anitya
          project-id: 5097
          url-template: 
            https://github.com/libvips/libvips/releases/download/v$version/vips-$version.tar.xz

  - name: appstream
    buildsystem: meson
    config-opts:
      - -Dbash-completion=false
      - -Dblake3-support=false
      - -Dstemming=false
      - -Dapidocs=false
      - -Dcompose=true
      - -Dgir=false
      - -Dman=false
    sources:
      - type: archive
        url: https://github.com/ximion/appstream/archive/refs/tags/v1.2.3.tar.gz
        sha256: 12f01e127081c485a3e3056b6d30f54d003101689ff815adac6f1ef2b19af6ab
        x-checker-data:
          type: anitya
          project-id: 10385
          url-template: https://github.com/ximion/appstream/archive/refs/tags/v$version.tar.gz
    cleanup:
      - /share/metainfo

  - name: jdAppStreamEdit
    buildsystem: simple
    build-commands:
      - pip install --no-deps --no-build-isolation --prefix=$FLATPAK_DEST .
      - python ./install-unix-datafiles.py --prefix=$FLATPAK_DEST
    sources:
      - type: archive
        url: https://codeberg.org/JakobDev/jdAppStreamEdit/archive/10.0.tar.gz
        sha256: 26654cb2bcc45d3b57d9f22bbf5158c98e684b4dcd7dfc124d5bd037bf070696
        x-checker-data:
          type: json
          url: https://codeberg.org/api/v1/repos/JakobDev/jdAppStreamEdit/releases/latest
          version-query: .tag_name
          url-query: .tarball_url
